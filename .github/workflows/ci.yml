name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'assets/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'assets/**'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Coordination acceptance (disposable repositories, no model calls)
        if: runner.os == 'Linux'
        run: python3 scripts/coordination_acceptance.py --binary target/debug/grove

      - name: PostgreSQL coordination storage acceptance (isolated, no cloud credentials)
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix scripts/postgres-fixture --ignore-scripts
          node scripts/postgres-fixture/server.mjs > /tmp/grove-sql-fixture.log 2>&1 &
          grove_sql_pid=$!
          trap 'kill "$grove_sql_pid"; cat /tmp/grove-sql-fixture.log' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:45217/health
          GROVE_TEST_SQL_ENDPOINT=http://127.0.0.1:45217 cargo test -p grove-cloud --lib --locked postgres_projection -- --ignored --nocapture

      - name: Bluehost PHP and MySQL storage acceptance (isolated, no cloud credentials)
        if: runner.os == 'Linux'
        run: python3 hosting/bluehost/tests/run.py
